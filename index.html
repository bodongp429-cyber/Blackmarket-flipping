<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albion Black Market Flipper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Albion Black Market Flipper</h1>
</header>

<main>
  <input type="text" placeholder="Cari item...">

  <h2>High Profit</h2>

  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Buy</th>
        <th>Sell</th>
        <th>Profit</th>
      </tr>
    </thead>

    <tbody id="marketTable">
      <tr>
        <td>T4 Soldier Boots</td>
        <td>12,000</td>
        <td>18,500</td>
        <td style="color:lime;">+54%</td>
      </tr>
    </tbody>

  </table>

</main>

<script src="script.js"></script>

</body>
</html>
